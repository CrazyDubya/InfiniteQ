[pytest]
testpaths = backend/tests
# The app package does `from app.services...` internally, so backend/ must be
# importable. Repo root stays on sys.path for `backend.app...` style imports.
pythonpath = . backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    integration: Integration tests (require full app)
    unit: Unit tests (isolated components)
    slow: Slow running tests
