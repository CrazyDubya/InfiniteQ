name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check for unresolved merge conflict markers
        # A conflicted file was committed to main once and broke the build.
        run: |
          if git grep -nE '^(<{7}|={7}|>{7})( |$)' -- '*.py' '*.ts' '*.tsx' '*.md' '*.json'; then
            echo "::error::Unresolved merge conflict markers found"
            exit 1
          fi

      - name: Byte-compile all backend sources
        # Catches syntax errors even if no test happens to import the module.
        run: python -m compileall -q backend/app

      - name: Verify the app imports
        env:
          STORAGE_TYPE: memory
          VULTR_INFERENCE_API_KEY: ci-placeholder
        working-directory: backend
        run: python -c "from app.main import app; print(f'{len(app.openapi()[\"paths\"])} API paths registered')"

      - name: Run tests
        env:
          STORAGE_TYPE: memory
          VULTR_INFERENCE_API_KEY: ci-placeholder
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
